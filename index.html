<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lanternkeeper — Ink &amp; Ember</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #07060a; --oil: #1a1210; --ember: #ff8a1f; --cream: #ffe2b0; }
      html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
      canvas#view { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 60%, rgba(26, 18, 16, 0.55), rgba(7, 6, 10, 0.92) 70%);
        color: var(--cream); font-family: 'IM Fell English', Georgia, serif; text-align: center; cursor: pointer;
        transition: opacity 0.6s; user-select: none;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay h1 { font-weight: normal; font-size: clamp(36px, 7vw, 84px); letter-spacing: 0.08em; margin: 0; color: var(--ember); }
      #overlay .sub { font-style: italic; font-size: 20px; opacity: 0.8; margin: 6px 0 36px; }
      #overlay .keys { font-size: 16px; line-height: 1.9; opacity: 0.85; }
      #overlay .keys b { color: var(--ember); font-weight: normal; }
      #overlay .go { margin-top: 32px; font-size: 22px; animation: breathe 2.6s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: 0.35; } }
      #overlay .goal { font-size: 19px; line-height: 1.6; max-width: 640px; margin: 0 24px 26px; opacity: 0.92; }
      #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'IM Fell English', Georgia, serif; color: var(--cream); z-index: 5; }
      #hud.hidden { display: none; }
      #hud-objective { position: absolute; left: 22px; top: 18px; font-size: 20px; letter-spacing: 0.04em; color: var(--ember); text-shadow: 0 0 6px #000; }
      #hud-flames { position: absolute; left: 22px; bottom: 22px; display: flex; gap: 10px; }
      .flame-pip { width: 16px; height: 26px; background: var(--ember); border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
        box-shadow: 0 0 10px rgba(255, 138, 31, 0.7), inset 0 -8px 0 var(--cream); transition: all 0.4s; }
      .flame-pip.lost { background: var(--oil); box-shadow: none; outline: 1px solid rgba(255, 138, 31, 0.35); }
      #hud-meter { position: absolute; left: 50%; bottom: 26px; width: 260px; height: 10px; transform: translateX(-50%);
        background: var(--oil); outline: 1px solid var(--ember); }
      #hud-meter-fill { height: 100%; background: var(--ember); width: 100%; }
      #hud-meter.blasting #hud-meter-fill { background: var(--cream); box-shadow: 0 0 12px var(--ember); }
      #hud-meter.burnout { outline-color: var(--oil); animation: sputter 0.25s steps(2) infinite; }
      #hud-meter.burnout #hud-meter-fill { background: repeating-linear-gradient(90deg, var(--ember) 0 6px, var(--oil) 6px 9px); }
      #hud-meter-label { position: absolute; left: 0; right: 0; top: -26px; text-align: center; font-size: 15px; letter-spacing: 0.12em; color: var(--ember); }
      @keyframes sputter { 50% { opacity: 0.55; } }
      #hud-prompt { position: absolute; left: 50%; top: 60%; transform: translateX(-50%); text-align: center; font-size: 19px; }
      #hud-prompt.hidden { display: none; }
      #hud-prompt .bar { margin: 8px auto 0; width: 160px; height: 4px; background: var(--oil); }
      #hud-prompt-fill { height: 100%; width: 0; background: var(--cream); }
      #hud-messages { position: absolute; left: 50%; top: 16%; transform: translateX(-50%); text-align: center; font-size: 22px; font-style: italic;
        color: var(--cream); text-shadow: 0 0 8px #000; }
      #hud-messages div { margin: 6px 0; transition: opacity 0.3s; }
      #minimap { position: absolute; right: 18px; top: 18px; width: 210px; height: 210px; opacity: 0.92; }
      #bigmap { display: none; position: fixed; left: 50%; top: 50%; width: 80vmin; height: 80vmin; transform: translate(-50%, -50%);
        z-index: 6; outline: 1px solid var(--ember); pointer-events: none; }
      #endcard { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 8;
        font-family: 'IM Fell English', Georgia, serif; color: var(--cream); text-align: center; transition: opacity 1.2s; }
      #endcard.hidden { opacity: 0; pointer-events: none; }
      #endcard h2 { font-weight: normal; font-size: clamp(30px, 5vw, 60px); color: var(--ember); margin: 0 0 14px; }
      #end-stats { font-size: 18px; opacity: 0.85; margin-bottom: 30px; }
      #endcard button { font: 20px 'IM Fell English', Georgia, serif; color: var(--cream); background: var(--oil); border: 1px solid var(--ember);
        padding: 10px 22px; margin: 0 8px; cursor: pointer; }
      #endcard button:hover { background: var(--ember); color: var(--ink); }
      #hud-oil { position: absolute; left: 22px; top: 48px; font-size: 17px; color: var(--cream); opacity: 0.85; text-shadow: 0 0 6px #000; }
      #hud-meter.hidden { display: none; }
      #end-oil { font-size: 19px; color: var(--ember); margin: -14px 0 30px; }
      #plate { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center;
        background: rgba(7, 6, 10, 0.78); font-family: 'IM Fell English', Georgia, serif; color: var(--cream); transition: opacity 0.4s; }
      #plate.hidden { opacity: 0; pointer-events: none; }
      .plate-inner { max-width: 620px; margin: 0 24px; padding: 34px 44px 26px; background: var(--ink); outline: 1px solid var(--ember);
        box-shadow: 0 0 0 6px var(--ink), 0 0 0 7px rgba(255, 138, 31, 0.35); text-align: center; }
      #plate-emblem { width: 110px; height: 110px; display: block; margin: 0 auto 10px; }
      #plate-title { font-weight: normal; color: var(--ember); font-size: 28px; margin: 0 0 14px; }
      #plate-body p { font-size: 19px; line-height: 1.55; margin: 0 0 12px; text-align: left; }
      .plate-go { margin-top: 16px; font-size: 14px; letter-spacing: 0.1em; opacity: 0.6; }
      #shrine { position: fixed; inset: 0; z-index: 7; overflow: auto; padding: 4vh 24px; box-sizing: border-box;
        font-family: 'IM Fell English', Georgia, serif; color: var(--cream); text-align: center; }
      #shrine.hidden { display: none; }
      #shrine h1 { font-weight: normal; font-size: clamp(36px, 6vw, 72px); letter-spacing: 0.08em; margin: 0; color: var(--ember); }
      #shrine .sub { font-style: italic; opacity: 0.8; margin-bottom: 18px; }
      #shrine .oil { font-size: 22px; margin-bottom: 22px; } #shrine .oil b { color: var(--ember); font-weight: normal; }
      #shrine .cols { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; text-align: left; }
      #shrine .col { width: min(420px, 100%); background: rgba(7, 6, 10, 0.82); outline: 1px solid rgba(255, 138, 31, 0.5); padding: 16px 20px; }
      #shrine h3 { font-weight: normal; color: var(--ember); margin: 0 0 10px; font-size: 21px; }
      #shrine .depth { display: flex; gap: 10px; align-items: baseline; padding: 7px 8px; cursor: pointer; border-bottom: 1px solid rgba(255, 138, 31, 0.15); }
      #shrine .depth.sel { background: var(--oil); } #shrine .depth input { accent-color: #ff8a1f; }
      #shrine .dn { color: var(--ember); width: 70px; } #shrine .dt { flex: 1; } #shrine .df { opacity: 0.7; font-size: 15px; }
      #shrine button { font: 19px 'IM Fell English', Georgia, serif; color: var(--cream); background: var(--oil); border: 1px solid var(--ember); padding: 8px 18px; cursor: pointer; }
      #shrine button:hover:not([disabled]) { background: var(--ember); color: var(--ink); }
      #shrine button[disabled] { opacity: 0.4; cursor: default; }
      #shrine #shrine-go { margin-top: 14px; width: 100%; font-size: 22px; }
      #shrine .warn { color: var(--ember); font-size: 15px; margin-top: 8px; min-height: 1em; }
      #shrine .upg { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255, 138, 31, 0.15); }
      #shrine .ul { width: 120px; } #shrine .uv { flex: 1; opacity: 0.75; font-size: 15px; }
      #shrine .dots i { display: inline-block; width: 9px; height: 9px; margin-right: 3px; outline: 1px solid var(--ember); }
      #shrine .dots i.on { background: var(--ember); }
      #shrine .upg button { font-size: 15px; padding: 4px 10px; min-width: 86px; }
      #shrine .none { opacity: 0.6; font-style: italic; }
      #shrine .keys { margin-top: 22px; font-size: 15px; opacity: 0.75; line-height: 1.8; } #shrine .keys b { color: var(--ember); font-weight: normal; }
      #shrine .reset { display: inline-block; margin-top: 16px; color: var(--oil); font-size: 13px; }
      #aim { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; }
      #fps {
        position: fixed; left: 10px; top: 8px; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace;
        color: var(--cream); background: rgba(7, 6, 10, 0.6); padding: 3px 7px; pointer-events: none; z-index: 10;
      }
      .toast {
        position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); padding: 8px 14px;
        background: var(--oil); color: var(--cream); font: 14px Georgia, serif; border: 1px solid var(--ember); z-index: 20;
      }
      .lil-gui { --background-color: #0d0b0e; --widget-color: #1a1210; --hover-color: #2a1d18; --focus-color: #3a271d;
        --number-color: #ff8a1f; --string-color: #ffe2b0; --title-background-color: #1a1210; --text-color: #e8d2a8; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay">
      <div class="sub" id="chapter-n">Depth 1</div>
      <h1 id="chapter-title">The Undercroft</h1>
      <div class="go">click to take up the lantern</div>
    </div>
    <div id="shrine" class="hidden"></div>
    <div id="plate" class="hidden">
      <div class="plate-inner">
        <canvas id="plate-emblem" width="140" height="140"></canvas>
        <h2 id="plate-title"></h2>
        <div id="plate-body"></div>
        <div class="plate-go">E · click — continue</div>
      </div>
    </div>
    <div id="hud" class="hidden">
      <div id="hud-objective"></div>
      <div id="hud-oil"></div>
      <div id="hud-flames"></div>
      <div id="hud-meter"><div id="hud-meter-fill"></div><span id="hud-meter-label"></span></div>
      <div id="hud-prompt" class="hidden"><div id="hud-prompt-text"></div><div class="bar"><div id="hud-prompt-fill"></div></div></div>
      <div id="hud-messages"></div>
      <canvas id="minimap" width="210" height="210"></canvas>
    </div>
    <canvas id="bigmap"></canvas>
    <canvas id="aim"></canvas>
    <div id="endcard" class="hidden">
      <h2 id="end-title"></h2>
      <div id="end-stats"></div>
      <div id="end-oil"></div>
      <div class="buttons"><button id="end-shrine">Return to the shrine</button></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
